name: Deploy to GitHub Pages

on:
  # Pages identifies deployments by source SHA. A push preview must not consume
  # the SHA that a later release needs to promote at the stable root.
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Determine base path and site path
        id: paths
        run: |
          echo "base=/" >> "$GITHUB_OUTPUT"
          echo "site_path=" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_BASE_PATH: ${{ steps.paths.outputs.base }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_API_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_API_HOST }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Install initiative-tracker dependencies
        run: pnpm -C initiative-tracker install --frozen-lockfile

      - name: Build initiative-tracker
        run: pnpm -C initiative-tracker run build
        env:
          VITE_BASE_PATH: ${{ steps.paths.outputs.base }}initiative-tracker/
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Restore existing site state
        run: |
          mkdir -p _site
          if git ls-remote --exit-code --heads origin pages-state >/dev/null 2>&1; then
            git fetch origin pages-state
            git worktree add ../site-state origin/pages-state
            cp -R ../site-state/. _site/
          fi
          touch _site/.nojekyll

      - name: Merge build into site
        env:
          SITE_PATH: ${{ steps.paths.outputs.site_path }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_TYPE" == "release" ]]; then
            find _site -mindepth 1 -maxdepth 1 ! -name '.nojekyll' ! -name CNAME -exec rm -rf {} + 2>/dev/null || true
            cp -R dist/. _site/
          else
            rm -rf "_site/${SITE_PATH}"
            mkdir -p "_site/${SITE_PATH}"
            cp -R dist/. "_site/${SITE_PATH}/"
          fi

          # Place the initiative-tracker app at <site>/initiative-tracker/.
          # On release SITE_PATH is empty → _site/initiative-tracker; on push
          # previews it nests under the preview subpath.
          it_dest="_site/${SITE_PATH:+$SITE_PATH/}initiative-tracker"
          rm -rf "$it_dest"
          mkdir -p "$it_dest"
          cp -R initiative-tracker/dist/. "$it_dest/"

          # Place the static token-generator app at <site>/token-generator/.
          tok_dest="_site/${SITE_PATH:+$SITE_PATH/}token-generator"
          rm -rf "$tok_dest"
          mkdir -p "$tok_dest"
          cp -R token-generator/. "$tok_dest/"
          cat > _site/deploy-info.txt <<EOF
          event=${{ github.event_name }}
          ref=${{ github.ref }}
          sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist site state
        if: always() && (steps.deployment.outputs.page_url != '')
        run: |
          git worktree remove --force ../site-state >/dev/null 2>&1 || true

          if git ls-remote --exit-code --heads origin pages-state >/dev/null 2>&1; then
            git fetch origin pages-state
            git worktree add ../site-state origin/pages-state
          else
            git worktree add --detach ../site-state
            cd ../site-state
            git switch --orphan pages-state
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cd -
          fi

          find ../site-state -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R _site/. ../site-state/

          cd ../site-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to persist."
            exit 0
          fi

          git commit -m "pages-state: ${{ github.event_name }} ${{ github.sha }}"
          git push origin HEAD:pages-state --force

      - name: Show deployed URL
        if: steps.deployment.outputs.page_url != ''
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_PATH: ${{ steps.paths.outputs.site_path }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_TYPE" == "release" || -z "$SITE_PATH" ]]; then
            URL="$BASE_URL"
          else
            URL="${BASE_URL%/}/$SITE_PATH/"
          fi
          echo "Deployed URL: $URL"
          echo "::notice title=Deployed URL::$URL"

      - name: Verify public release bytes
        timeout-minutes: 20
        env:
          SITE_URL: https://popul8.app
        run: |
          bundle_path=$(sed -nE 's/.*<script[^>]*src="([^"]+\.js)".*/\1/p' _site/index.html)
          case "$bundle_path" in
            /assets/*.js) ;;
            *) echo "::error::Expected one root JavaScript bundle under /assets/"; exit 1 ;;
          esac

          verification_dir=$(mktemp -d)
          trap 'rm -rf "$verification_dir"' EXIT

          for attempt in $(seq 1 10); do
            verified=true
            for path in /index.html /deploy-info.txt "$bundle_path"; do
              public_path=$path
              if [[ "$path" == /index.html ]]; then public_path=/; fi
              if ! curl --fail --silent --show-error --max-time 20 \
                --proto '=https' --proto-redir '=https' \
                --user-agent 'Popul8-release-verification' \
                --output "$verification_dir/response" "$SITE_URL$public_path" || \
                ! cmp -s "_site$path" "$verification_dir/response"; then
                echo "Public content does not match the release artifact: $public_path"
                verified=false
              fi
            done
            if [[ "$verified" == true ]]; then
              echo "Canonical root, deploy marker, and root bundle match the release artifact."
              exit 0
            fi
            if [[ "$attempt" -lt 10 ]]; then sleep 60; fi
          done
          echo "::error::Pages reported success but the public release bytes differ."
          exit 1
